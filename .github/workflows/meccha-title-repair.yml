name: MECCHA verified working DLL

on:
  push:
    branches: [PEAK-random-name]
    paths:
      - .github/workflows/meccha-title-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Find the verified V15 build
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh api "repos/${{ github.repository }}/actions/runs?head_sha=7e56b3c661514bd81cadd78a6bcd79f30ae126a9&per_page=10" | ConvertFrom-Json
          $build = $runs.workflow_runs | Where-Object { $_.name -eq "MECCHA verified release DLL" -and $_.conclusion -eq "success" } | Select-Object -First 1
          if (!$build) { throw "The verified V15 source build was not found" }
          "run_id=$($build.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download the verified V15 DLL
        uses: actions/download-artifact@v4
        with:
          name: MECCHA_Title_Fixed_7e56b3c661514bd81cadd78a6bcd79f30ae126a9
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verified_source

      - name: Verify and prepare direct DLL download
        shell: pwsh
        run: |
          $source = Get-ChildItem verified_source -Recurse -Filter steam_api64.dll | Select-Object -First 1
          if (!$source) { throw "steam_api64.dll was not found in the verified build" }

          $expected = "0ACE29E50E287E1694CFE890191D932CE2096E783059608254BBAAA9F6FCBA4C"
          $actual = (Get-FileHash $source.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Verified DLL hash mismatch. Expected $expected but got $actual"
          }

          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item $source.FullName "publish/steam_api64.dll"
          $checksum = $actual.ToLowerInvariant() + "  steam_api64.dll"
          Set-Content -Path "publish/steam_api64.sha256" -Value $checksum -Encoding ascii
          Write-Output "PASS: exact working V15 DLL verified and ready for direct download"

      - name: Publish exact working DLL
        uses: actions/upload-artifact@v7
        with:
          name: MECCHA_Working_steam_api64_V15
          path: |
            publish/steam_api64.dll
            publish/steam_api64.sha256
          if-no-files-found: error
          compression-level: 9
          retention-days: 90